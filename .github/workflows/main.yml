name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project and Icon
        run: |
          flutter create . --overwrite --platforms=android
          # Icon badalne ke liye hum image ko launcher icon folder mein copy karenge
          mkdir -p android/app/src/main/res/mipmap-hdpi
          cp 1778294859279_1.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easyloan-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
