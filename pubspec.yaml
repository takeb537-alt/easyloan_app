name: easy_loan
description: "A production-ready loan app optimized for Itel S23"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  # Stable package for device binding (Itel S23 support)
  device_info_plus: ^10.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
